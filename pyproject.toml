[project]
name = "daimon"
version = "0.1.0"
description = "Daily letters from philosophers — a LangGraph agent grounded in their works."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "click>=8.1",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "scikit-learn>=1.3",
    "requests>=2.31",
    "networkx>=3.0",
    "pyvis>=0.3.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
vector = ["chromadb>=0.5"]            # opt-in vector RAG backend: DAIMON_RAG_BACKEND=chroma
graph = ["neo4j>=5"]                  # opt-in Neo4j export: daimon themes --neo4j
turso = ["libsql-experimental>=0.0.30"]  # durable cloud storage: TURSO_DATABASE_URL

[project.scripts]
daimon = "daimon.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daimon = ["web/*", "rag/corpus/*.txt"]
