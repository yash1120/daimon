<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Daimon">
  <defs>
    <radialGradient id="disc" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1A2236"/>
      <stop offset="55%" stop-color="#0E1320"/>
      <stop offset="100%" stop-color="#080B14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0BE6E"/>
      <stop offset="100%" stop-color="#C9A24B"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed dark disc (maskable-safe: art kept within the central ~80%) -->
  <rect width="512" height="512" fill="#0E1320"/>
  <circle cx="256" cy="256" r="232" fill="url(#disc)"/>
  <circle cx="256" cy="256" r="231" fill="none" stroke="#283449" stroke-width="2" opacity="0.7"/>

  <!-- The daimon orbit mark (echoes the nav wordmark glyph) -->
  <g fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round">
    <circle cx="256" cy="262" r="118"/>
    <path d="M256 144a118 118 0 0 1 104 62" opacity="0.55"/>
  </g>
  <!-- Central core + bright satellite mote -->
  <circle cx="256" cy="262" r="26" fill="url(#gold)"/>
  <circle cx="368" cy="184" r="21" fill="#E0BE6E"/>
</svg>
